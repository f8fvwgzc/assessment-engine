[package]
name = "assessment-server"
description = "Standalone gRPC server and CLI for the assessment engine"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "assessment-engine"
path = "src/main.rs"

[features]
default = ["judge"]
# The HTTP client for the Anthropic Messages API. Without it the binary has
# no judge and `--judge on` is refused.
judge = ["assessment-judge/anthropic"]

[dependencies]
anyhow.workspace = true
assessment-core.workspace = true
assessment-grpc.workspace = true
assessment-judge = { version = "0.1.0", path = "../assessment-judge", default-features = false }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
