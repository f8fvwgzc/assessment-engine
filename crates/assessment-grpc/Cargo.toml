[package]
name = "assessment-grpc"
description = "gRPC contract, tonic service and client for the assessment engine"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["server", "client"]
# The tonic service, bearer-token auth and the server wiring (health, reflection).
server = ["dep:assessment-judge", "dep:subtle", "dep:tonic-health", "dep:tonic-reflection", "dep:tower"]
# The ergonomic client over core types.
client = []

[dependencies]
assessment-core.workspace = true
assessment-judge = { version = "0.1.0", path = "../assessment-judge", default-features = false, optional = true }
chrono.workspace = true
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
subtle = { version = "2.6", optional = true }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health = { workspace = true, optional = true }
tonic-prost.workspace = true
tonic-reflection = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing.workspace = true

[build-dependencies]
prost.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "nexc_client"
required-features = ["client"]

[[test]]
name = "grpc"
required-features = ["server", "client"]

[[test]]
name = "judge"
required-features = ["server", "client"]

[lints]
workspace = true
