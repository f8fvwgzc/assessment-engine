[package]
name = "assessment-judge"
description = "Optional model judge for the assessment engine: reads a flagged text change and says how its meaning changed"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["anthropic", "openai", "cli"]
# The HTTP client for the Anthropic Messages API.
anthropic = ["dep:reqwest"]
# The HTTP client for the OpenAI Chat Completions API. Without `anthropic`
# and `openai` the crate has no HTTP or TLS dependency.
openai = ["dep:reqwest"]
# Judges that run a locally installed agent command line (Claude Code or
# Codex) as a child process. Without it the crate starts no process.
cli = ["tokio/process", "tokio/io-util", "tokio/fs"]

[dependencies]
assessment-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"], optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "anthropic_http"
required-features = ["anthropic"]

[[test]]
name = "openai_http"
required-features = ["openai"]

[[test]]
name = "cli_process"
required-features = ["cli"]

[[example]]
name = "judge_cases"
required-features = ["anthropic", "openai", "cli"]

[lints]
workspace = true
