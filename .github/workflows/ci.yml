name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all --workspace --all-targets -- -D warnings
      - run: cargo test --locked --all --workspace

  msrv:
    name: Rust 1.88 (MSRV)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The toolchain file pins the development toolchain; MSRV builds with the older one.
      - run: rm rust-toolchain.toml && cargo +1.88.0 check --locked --all --workspace

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: assessment-engine:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Serves and reports healthy
        run: |
          docker run -d --name engine -p 50061:50061 assessment-engine:ci
          for _ in $(seq 1 30); do
            if docker exec engine assessment-engine health; then exit 0; fi
            sleep 1
          done
          docker logs engine
          exit 1
